<!-- searching multiple element  -->

 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiple same number searching</title>
</head>
<body>
       <script>
      let array = [40, 76, 40, 50, 60];
        let el = [];
        let fel =40 ;

        // Iterate through the entire array
        for(let i = 0; i < array.length; i++) {
            if(fel == array[i]) {
                el.push(i); // Store the index of the matching element
            }
        }

        // Iterate through the stored indices and log the index and the element at that index
        if (el.length>0){
        for(let j = 0; j < el.length; j++) {
            console.log(`Element ${array[el[j]]} found at index ${el[j]}`);
        }}
        else{
            alert(' Enter the number which was in array.')
        }
 
    </script>
</body>
</html>
